<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="iteagrow">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Google Sign-In Configuration -->
  <meta name="google-signin-client_id" content="422600401949-2icliet7cotors3q8equqi2ahcncb7ts.apps.googleusercontent.com">

  <title>iteagrow</title>
  <link rel="manifest" href="manifest.json">
</head>
  <div id="loading" style="display: flex; justify-content: center; align-items: center; height: 100vh; font-family: sans-serif; flex-direction: column;">
    <div style="font-size: 24px; margin-bottom: 20px;">iTeaGrow is Loading...</div>
    <div id="error-box" style="display: none; background: #ffebee; color: #c62828; padding: 20px; border: 1px solid #ef5350; border-radius: 8px; max-width: 80%; word-break: break-all; margin-top: 20px;">
      <div style="font-weight: bold; margin-bottom: 10px;">Startup Error Detected:</div>
      <div id="error-message"></div>
    </div>
  </div>
  <script>
    window.flutterWebRenderer = "html";
    window.addEventListener('error', function(event) {
      document.getElementById('loading').style.display = 'flex';
      document.getElementById('error-box').style.display = 'block';
      document.getElementById('error-message').innerText = event.message + '\nat ' + event.filename + ':' + event.lineno;
    });
    window.addEventListener('unhandledrejection', function(event) {
      document.getElementById('loading').style.display = 'flex';
      document.getElementById('error-box').style.display = 'block';
      document.getElementById('error-message').innerText = 'Unhandled Promise: ' + event.reason;
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
