name: iteagrow
description: "iTeaGrow: AI-powered Tea Leaf Disease Detection with IoT Integration"
publish_to: 'none'
version: 2.0.0+2  # Production-ready version

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Routing
  go_router: 13.0.0  # Pinned for build compatibility

  # Database
  sqflite: ^2.3.2
  sqflite_common_ffi_web: ^0.4.0
  path: ^1.9.0
  path_provider: ^2.1.2

  # Security
  crypto: ^3.0.3
  local_auth: ^2.2.0
  flutter_secure_storage: ^9.0.0
  google_sign_in: ^6.2.1

  # IoT Connectivity
  flutter_blue_plus: 1.32.12  # Pinned to stable version for Android build
  http: ^1.2.0
  mqtt_client: ^10.2.0
  web_socket_channel: ^2.4.0

  tflite_flutter: ^0.11.0  # Updated for Dart SDK compatibility
  pytorch_lite: ^4.2.5
  image_picker: ^1.0.7
  camera: 0.10.5+9  # Pinned for Android build compatibility
  image: ^4.1.7

  # Charts & Visualization
  fl_chart: 0.66.2  # Pinned for build compatibility

  # UI Components
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.10+1

  # 3D Rendering
  model_viewer_plus: ^1.6.0

  # Animations
  rive: ^0.13.4
  lottie: ^3.1.0
  flutter_animate: ^4.5.0
  animations: ^2.0.11

  # Glass & Effects
  glassmorphism: ^3.0.0
  blur: ^4.0.0

  # Image Caching & Loading
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0

  # Location & Permissions
  geolocator: ^13.0.1  # Updated for compatibility
  permission_handler: ^11.3.1  # Updated for compatibility

  # Utilities
  intl: ^0.19.2
  shared_preferences: ^2.2.2
  uuid: ^4.3.3
  pdf: ^3.11.3
  printing: ^5.14.2

  web: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  riverpod_generator: ^2.3.11
  build_runner: ^2.4.8
  riverpod_lint: ^2.3.10

flutter:
  uses-material-design: true

  generate: true

  assets:
    - assets/images/
    - assets/images/backgrounds/
    - assets/images/icons/
    - assets/images/placeholders/
    - assets/animations/
    - assets/animations/rive/
    - assets/animations/lottie/
    - assets/models/
