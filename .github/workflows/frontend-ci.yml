# =============================================================================
# FRONTEND CI WORKFLOW
# =============================================================================
# Purpose: Flutter/Dart mobile app quality and testing pipeline
# Triggers: Push to main/develop, PRs affecting frontend code
# =============================================================================

name: Frontend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [main, develop, staging]
    paths:
      - 'frontend/**'
  workflow_dispatch:

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  FLUTTER_VERSION: "3.16.0"
  JAVA_VERSION: "17"

jobs:

  analyze:
    name: Analyze & Format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/iTeaGrow---Research-Project

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --set-exit-if-changed .

      - name: Analyze code
        run: flutter analyze --no-fatal-infos

      - name: Check for unused dependencies
        run: |
          flutter pub deps --style=compact || true


  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [analyze]
    defaults:
      run:
        working-directory: frontend/iTeaGrow---Research-Project

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run unit tests
        run: |
          flutter test --coverage --reporter=json > test-results.json || true

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: frontend/iTeaGrow---Research-Project/coverage/lcov.info
          flags: frontend
          name: flutter-coverage
          fail_ci_if_error: false
        continue-on-error: true


  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: [analyze]
    defaults:
      run:
        working-directory: frontend/iTeaGrow---Research-Project

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (Debug)
        run: |
          flutter build apk --debug --no-tree-shake-icons

      - name: Build APK (Release) - Unsigned
        run: |
          flutter build apk --release --no-tree-shake-icons || true
        continue-on-error: true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: frontend/iTeaGrow---Research-Project/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
        if: success()


  build-ios:
    name: Build iOS
    runs-on: macos-latest
    needs: [analyze]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: frontend/iTeaGrow---Research-Project

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS (no signing)
        run: |
          flutter build ios --debug --no-codesign || true
        continue-on-error: true

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    needs: [analyze]
    defaults:
      run:
        working-directory: frontend/iTeaGrow---Research-Project

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Web
        run: |
          flutter build web --release || true
        continue-on-error: true

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: frontend/iTeaGrow---Research-Project/build/web
          retention-days: 7
        if: success()

  security:
    name: Security Analysis
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/iTeaGrow---Research-Project

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Check for outdated packages
        run: |
          flutter pub outdated

      - name: Analyze for security issues
        run: |
          # Check for common security anti-patterns
          echo "Checking for hardcoded secrets..."
          grep -rn "api_key\|apiKey\|secret\|password" lib/ --include="*.dart" | grep -v "// " | grep -v "/// " || true

          echo "Checking for insecure HTTP..."
          grep -rn "http://" lib/ --include="*.dart" | grep -v "localhost" | grep -v "// " || true

          echo "Security scan complete"
        continue-on-error: true


  codegen:
    name: Code Generation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/iTeaGrow---Research-Project

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run code generation
        run: |
          dart run build_runner build --delete-conflicting-outputs || true
        continue-on-error: true

      - name: Check for uncommitted generated files
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::warning::Generated files may be out of sync. Run 'dart run build_runner build' locally."
            git diff --stat
          fi
        continue-on-error: true


  frontend-status:
    name: Frontend CI Status
    runs-on: ubuntu-latest
    needs: [analyze, test, build-android, security, codegen]
    if: always()
    steps:
      - name: Check status
        run: |
          echo "## Frontend CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Analyze & Format | ${{ needs.analyze.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ${{ needs.test.result == 'success' && '✅' || '⚠️' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Android Build | ${{ needs.build-android.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security | ${{ needs.security.result == 'success' && '✅' || '⚠️' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Code Generation | ${{ needs.codegen.result == 'success' && '✅' || '⚠️' }} |" >> $GITHUB_STEP_SUMMARY

          # Fail if critical checks failed
          if [ "${{ needs.analyze.result }}" != "success" ]; then
            echo "::error::Code analysis failed"
            exit 1
          fi
          if [ "${{ needs.build-android.result }}" != "success" ]; then
            echo "::error::Android build failed"
            exit 1
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Frontend CI passed!" >> $GITHUB_STEP_SUMMARY
