# =============================================================================
# PR VALIDATION WORKFLOW
# =============================================================================
# Purpose: Gate-keeper workflow that runs on every PR to protected branches
# Ensures code quality, security, and consistency before merge
# =============================================================================

name: PR Validation

on:
  pull_request:
    branches: [main, develop, staging]
    types: [opened, synchronize, reopened, ready_for_review]

  # Allow manual trigger for debugging
  workflow_dispatch:

# Cancel in-progress runs for the same PR
concurrency:
  group: pr-validation-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

# Minimal permissions - principle of least privilege
permissions:
  contents: read
  pull-requests: write
  security-events: write

env:
  PYTHON_VERSION: "3.10"
  FLUTTER_VERSION: "3.16.0"
  NODE_VERSION: "20"

jobs:

  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      docker: ${{ steps.filter.outputs.docker }}
      iot: ${{ steps.filter.outputs.iot }}
      config: ${{ steps.filter.outputs.config }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect file changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'src/**'
              - 'backend/**'
              - 'tests/**'
              - 'requirements*.txt'
              - 'pyproject.toml'
              - 'setup.py'
            frontend:
              - 'frontend/**'
              - 'pubspec.yaml'
              - 'pubspec.lock'
            docker:
              - 'docker/**'
              - 'docker-compose*.yml'
              - 'Dockerfile*'
            iot:
              - 'iot/**'
              - '**/*.ino'
            config:
              - 'configs/**'
              - '.env.example'
              - '.env.prod'
            workflows:
              - '.github/**'


  security-gate:
    name: Security Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for secret scanning

      # Prevent secrets from being committed
      - name: Scan for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          extra_args: --only-verified

      # Backup secret detection with gitleaks
      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Block large files
      - name: Check for large files
        run: |
          echo "Checking for files larger than 50MB..."
          large_files=$(find . -type f -size +50M -not -path "./.git/*" 2>/dev/null || true)
          if [ -n "$large_files" ]; then
            echo "::error::Large files detected (>50MB):"
            echo "$large_files"
            exit 1
          fi
          echo "✓ No large files detected"

      # Block ML model files in PR (should use Git LFS or external storage)
      - name: Check for model artifacts
        run: |
          echo "Checking for ML model files that shouldn't be committed..."
          model_files=$(git diff --name-only ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }} | grep -E '\.(pt|pth|onnx|h5|pkl|joblib|safetensors)$' || true)
          if [ -n "$model_files" ]; then
            echo "::error::ML model files should not be committed directly. Use Git LFS or external model registry:"
            echo "$model_files"
            exit 1
          fi
          echo "✓ No model artifacts in PR"

      # Block .env files (except examples)
      - name: Check for environment files
        run: |
          echo "Checking for .env files..."
          env_files=$(git diff --name-only ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }} | grep -E '^\.env$|\.env\.[^e]|\.env$' | grep -v '.env.example' | grep -v '.env.prod' || true)
          if [ -n "$env_files" ]; then
            echo "::error::Environment files with secrets should never be committed:"
            echo "$env_files"
            exit 1
          fi
          echo "✓ No secret environment files"

      # Check for common security anti-patterns
      - name: Check for dangerous patterns
        run: |
          echo "Scanning for dangerous code patterns..."

          # Check Python files for dangerous patterns
          dangerous_patterns=0

          # eval() usage (potential code injection)
          if grep -r "eval(" --include="*.py" . 2>/dev/null | grep -v "# nosec" | grep -v "test_"; then
            echo "::warning::Found eval() usage - review for security"
            dangerous_patterns=$((dangerous_patterns + 1))
          fi

          # Hardcoded passwords/tokens
          if grep -rE "(password|secret|token|api_key)\s*=\s*['\"][^'\"]+['\"]" --include="*.py" . 2>/dev/null | grep -v "# nosec" | grep -v "test_" | grep -v "example"; then
            echo "::warning::Potential hardcoded credentials detected"
            dangerous_patterns=$((dangerous_patterns + 1))
          fi

          if [ $dangerous_patterns -gt 0 ]; then
            echo "::warning::Found $dangerous_patterns potential security issues - please review"
          fi

          echo "✓ Security pattern scan complete"


  backend-quality:
    name: Backend Quality
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: needs.detect-changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff black isort mypy bandit safety pytest pytest-cov
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # Linting with Ruff (fast, modern Python linter)
      - name: Lint with Ruff
        run: |
          ruff check src/ backend/ tests/ --output-format=github
        continue-on-error: false

      # Code formatting check
      - name: Check formatting with Black
        run: |
          black --check --diff src/ backend/ tests/

      # Import sorting check
      - name: Check import sorting with isort
        run: |
          isort --check-only --diff src/ backend/ tests/

      # Type checking
      - name: Type check with mypy
        run: |
          mypy src/ --ignore-missing-imports --no-error-summary || true
        continue-on-error: true  # Gradual adoption

      # Security analysis
      - name: Security scan with Bandit
        run: |
          bandit -r src/ backend/ -ll -ii -f json -o bandit-report.json || true
          bandit -r src/ backend/ -ll -ii

      # Dependency vulnerability scan
      - name: Check dependencies for vulnerabilities
        run: |
          pip freeze > requirements-lock.txt
          safety check -r requirements-lock.txt --full-report || true
        continue-on-error: true  # Advisory only

      # Run tests
      - name: Run tests
        run: |
          pytest tests/ -v --cov=src --cov-report=xml --cov-report=term-missing
        continue-on-error: true

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false


  frontend-quality:
    name: Frontend Quality
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: needs.detect-changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'

    defaults:
      run:
        working-directory: frontend/iTeaGrow---Research-Project

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Dart analysis (linting)
      - name: Analyze Dart code
        run: flutter analyze --no-fatal-warnings

      # Format check
      - name: Check formatting
        run: dart format --set-exit-if-changed .

      # Run tests
      - name: Run tests
        run: flutter test --coverage || true

      # Build check (ensure it compiles)
      - name: Check build
        run: flutter build apk --debug --no-tree-shake-icons || true

  docker-validation:
    name: Docker Validation
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: needs.detect-changes.outputs.docker == 'true' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Lint Dockerfiles
      - name: Lint Dockerfiles
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: docker/gateway/Dockerfile
          failure-threshold: warning

      - name: Lint inference Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: docker/inference/Dockerfile
          failure-threshold: warning
        continue-on-error: true

      # Validate docker-compose
      - name: Validate docker-compose
        run: |
          docker compose -f docker-compose.yml config --quiet
          echo "✓ docker-compose.yml is valid"

      # Security scan with Trivy
      - name: Build and scan gateway image
        run: |
          docker build -t tealeaf-gateway:scan -f docker/gateway/Dockerfile .
        continue-on-error: true

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'tealeaf-gateway:scan'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
        continue-on-error: true


  commit-lint:
    name: Commit Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install commitlint
        run: |
          npm install -g @commitlint/cli @commitlint/config-conventional

      - name: Validate commit messages
        run: |
          # Create commitlint config
          echo "module.exports = {extends: ['@commitlint/config-conventional']}" > commitlint.config.js

          # Check all commits in PR
          npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose || true
        continue-on-error: true  # Advisory for now


  pr-size:
    name: PR Size Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check PR size
        run: |
          # Get lines changed
          ADDITIONS=$(gh pr view ${{ github.event.pull_request.number }} --json additions -q '.additions')
          DELETIONS=$(gh pr view ${{ github.event.pull_request.number }} --json deletions -q '.deletions')
          TOTAL=$((ADDITIONS + DELETIONS))

          echo "PR Statistics:"
          echo "  Additions: $ADDITIONS"
          echo "  Deletions: $DELETIONS"
          echo "  Total changes: $TOTAL"

          if [ $TOTAL -gt 1000 ]; then
            echo "::warning::Large PR detected ($TOTAL lines changed). Consider breaking into smaller PRs."
          elif [ $TOTAL -gt 500 ]; then
            echo "::notice::Medium-sized PR ($TOTAL lines). Consider if it can be split."
          else
            echo "✓ PR size is reasonable"
          fi
        env:
          GH_TOKEN: ${{ github.token }}


  pr-status:
    name: PR Status
    runs-on: ubuntu-latest
    needs: [security-gate, backend-quality, frontend-quality, docker-validation, commit-lint, pr-size]
    if: always()
    steps:
      - name: Check all job statuses
        run: |
          echo "## PR Validation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Security gate is mandatory
          if [ "${{ needs.security-gate.result }}" != "success" ]; then
            echo "::error::Security gate failed - this must pass before merge"
            echo "❌ Security Gate: FAILED" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "✅ Security Gate: PASSED" >> $GITHUB_STEP_SUMMARY

          # Report other statuses
          echo "Backend Quality: ${{ needs.backend-quality.result }}" >> $GITHUB_STEP_SUMMARY
          echo "Frontend Quality: ${{ needs.frontend-quality.result }}" >> $GITHUB_STEP_SUMMARY
          echo "Docker Validation: ${{ needs.docker-validation.result }}" >> $GITHUB_STEP_SUMMARY
          echo "Commit Lint: ${{ needs.commit-lint.result }}" >> $GITHUB_STEP_SUMMARY
          echo "PR Size: ${{ needs.pr-size.result }}" >> $GITHUB_STEP_SUMMARY

          # Backend and Frontend must pass if they ran
          if [ "${{ needs.backend-quality.result }}" == "failure" ]; then
            echo "::error::Backend quality checks failed"
            exit 1
          fi

          if [ "${{ needs.frontend-quality.result }}" == "failure" ]; then
            echo "::error::Frontend quality checks failed"
            exit 1
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ All required checks passed!" >> $GITHUB_STEP_SUMMARY
