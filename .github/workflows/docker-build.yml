# =============================================================================
# DOCKER BUILD & SECURITY WORKFLOW
# =============================================================================
# Purpose: Build, scan, and publish Docker images with security validation
# Triggers: Push to main/develop, PRs, releases
# =============================================================================

name: Docker Build

on:
  push:
    branches: [main, develop]
    paths:
      - 'docker/**'
      - 'docker-compose*.yml'
      - 'src/**'
      - 'requirements*.txt'
      - '.github/workflows/docker-build.yml'
    tags:
      - 'v*'
  pull_request:
    branches: [main, develop]
    paths:
      - 'docker/**'
      - 'docker-compose*.yml'
  workflow_dispatch:
    inputs:
      push_image:
        description: 'Push image to registry'
        required: false
        default: false
        type: boolean

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  security-events: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:

  lint:
    name: Lint Dockerfiles
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint gateway Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: docker/gateway/Dockerfile
          failure-threshold: error
          ignore: DL3008,DL3013,DL3042

      - name: Lint inference Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: docker/inference/Dockerfile
          failure-threshold: error
          ignore: DL3008,DL3013,DL3042
        continue-on-error: true

      - name: Validate docker-compose
        run: |
          docker compose -f docker-compose.yml config --quiet
          echo "✓ docker-compose.yml is valid"

          if [ -f docker-compose.gpu.yml ]; then
            docker compose -f docker-compose.yml -f docker-compose.gpu.yml config --quiet
            echo "✓ GPU compose overlay is valid"
          fi


  build-gateway:
    name: Build Gateway Image
    runs-on: ubuntu-latest
    needs: [lint]
    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
      image_tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/gateway
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        if: github.event_name != 'pull_request'

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/gateway/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ steps.meta.outputs.version }}

      - name: Export image for scanning
        run: |
          docker build -t tealeaf-gateway:scan -f docker/gateway/Dockerfile .

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: gateway-image
          path: /tmp/gateway-image.tar
          retention-days: 1
        if: false  # Disabled - images are large


  build-inference:
    name: Build Inference Image
    runs-on: ubuntu-latest
    needs: [lint]
    if: github.event_name == 'push' || github.event.inputs.push_image == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/inference
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=cpu

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/inference/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64


  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [build-gateway]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image for scanning
        run: |
          docker build -t tealeaf-gateway:scan -f docker/gateway/Dockerfile .

      # Trivy vulnerability scanner
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'tealeaf-gateway:scan'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          vuln-type: 'os,library'
          ignore-unfixed: true

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy-container'
        continue-on-error: true

      # Grype scanner (alternative view)
      - name: Grype vulnerability scan
        uses: anchore/scan-action@v3
        id: grype
        with:
          image: 'tealeaf-gateway:scan'
          fail-build: false
          severity-cutoff: critical

      - name: Upload Grype scan results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}
          category: 'grype-container'
        continue-on-error: true

      # Dockle best practices
      - name: Dockle lint
        uses: erzz/dockle-action@v1
        with:
          image: 'tealeaf-gateway:scan'
          failure-threshold: high
          exit-code: 0
          accept-filenames: models/*


  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    needs: [build-gateway]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build -t tealeaf-gateway:sbom -f docker/gateway/Dockerfile .

      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          image: 'tealeaf-gateway:sbom'
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json
          retention-days: 90


  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest
    needs: [build-gateway, security-scan]
    if: github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and start services
        run: |
          docker compose -f docker-compose.yml build
          docker compose -f docker-compose.yml up -d

      - name: Wait for services
        run: |
          echo "Waiting for services to be healthy..."
          sleep 30

          # Check gateway health
          for i in {1..10}; do
            if curl -sf http://localhost:8000/health/live; then
              echo "Gateway is healthy"
              break
            fi
            echo "Waiting for gateway... ($i/10)"
            sleep 5
          done

      - name: Run smoke tests
        run: |
          # Health check
          curl -sf http://localhost:8000/health/live || exit 1
          echo "✓ Health endpoint OK"

          # API docs
          curl -sf http://localhost:8000/docs || echo "Docs endpoint check"

          echo "✓ Smoke tests passed"

      - name: Collect logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.yml logs > docker-logs.txt
          cat docker-logs.txt

      - name: Upload logs
        uses: actions/upload-artifact@v4
        with:
          name: docker-logs
          path: docker-logs.txt
          retention-days: 3
        if: failure()

      - name: Cleanup
        if: always()
        run: |
          docker compose -f docker-compose.yml down -v


  docker-status:
    name: Docker Build Status
    runs-on: ubuntu-latest
    needs: [lint, build-gateway, security-scan]
    if: always()
    steps:
      - name: Check status
        run: |
          echo "## Docker Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Dockerfile Lint | ${{ needs.lint.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Gateway | ${{ needs.build-gateway.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Scan | ${{ needs.security-scan.result == 'success' && '✅' || '⚠️' }} |" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.lint.result }}" != "success" ]; then
            echo "::error::Dockerfile linting failed"
            exit 1
          fi
          if [ "${{ needs.build-gateway.result }}" != "success" ]; then
            echo "::error::Gateway image build failed"
            exit 1
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Docker build pipeline passed!" >> $GITHUB_STEP_SUMMARY
