# =============================================================================
# DEPENDABOT CONFIGURATION
# =============================================================================
# Automated dependency updates for security and maintenance
# =============================================================================

version: 2

registries:
  # Add private registry configurations here if needed
  # ghcr:
  #   type: docker-registry
  #   url: ghcr.io
  #   username: ${{ secrets.GHCR_USERNAME }}
  #   password: ${{ secrets.GHCR_TOKEN }}

updates:

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    reviewers:
      - "Thomiantrooper"
    labels:
      - "dependencies"
      - "python"
      - "automated"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      # Group minor/patch updates together
      python-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      # Security updates get their own PRs
      python-security:
        applies-to: security-updates
    ignore:
      # Ignore major version updates for core ML libraries (require manual review)
      - dependency-name: "torch"
        update-types: ["version-update:semver-major"]
      - dependency-name: "ultralytics"
        update-types: ["version-update:semver-major"]
      - dependency-name: "onnxruntime*"
        update-types: ["version-update:semver-major"]


  - package-ecosystem: "pub"
    directory: "/frontend/iTeaGrow---Research-Project"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    reviewers:
      - "Thomiantrooper"
    labels:
      - "dependencies"
      - "flutter"
      - "automated"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      flutter-updates:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"


  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    reviewers:
      - "Thomiantrooper"
    labels:
      - "dependencies"
      - "github-actions"
      - "automated"
    commit-message:
      prefix: "chore(ci)"
      include: "scope"
    groups:
      actions-updates:
        patterns:
          - "*"


  - package-ecosystem: "docker"
    directory: "/docker/gateway"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 3
    reviewers:
      - "Thomiantrooper"
    labels:
      - "dependencies"
      - "docker"
      - "automated"
    commit-message:
      prefix: "chore(docker)"
      include: "scope"

  - package-ecosystem: "docker"
    directory: "/docker/inference"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 3
    reviewers:
      - "Thomiantrooper"
    labels:
      - "dependencies"
      - "docker"
      - "automated"
    commit-message:
      prefix: "chore(docker)"
      include: "scope"
