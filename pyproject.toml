# =============================================================================
# PYTHON PROJECT CONFIGURATION
# =============================================================================
# Unified configuration for all Python tooling: linting, formatting, testing
# =============================================================================

[project]
name = "tealeaf-disease-detection"
version = "1.0.0"
description = "AI-powered tea leaf disease detection system with IoT integration"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "iTeaGrow Team" }
]
keywords = ["tea", "disease-detection", "yolov8", "fastapi", "iot", "machine-learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Repository = "https://github.com/Thomiantrooper/iTeaGrow---Research-Project"

# =============================================================================
# RUFF - Fast Python Linter & Formatter
# =============================================================================
[tool.ruff]
target-version = "py310"
line-length = 100
indent-width = 4

# Exclude directories
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    ".pytest_cache",
    ".mypy_cache",
    ".ruff_cache",
    "build",
    "dist",
    "*.egg-info",
    "node_modules",
    "frontend",
    "runs",
    "models",
    "notebooks",
    ".ipynb_checkpoints",
]

[tool.ruff.lint]
# Enable rules
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "S",      # flake8-bandit (security)
    "DTZ",    # flake8-datetimez
    "T20",    # flake8-print
    "RUF",    # Ruff-specific rules
]

# Ignore specific rules
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # function call in default argument (common in FastAPI)
    "B904",   # raise without from (sometimes intentional)
    "S101",   # assert usage (OK in tests)
    "S104",   # binding to all interfaces (intentional for containers)
    "S105",   # hardcoded password (false positives)
    "S106",   # hardcoded password (false positives)
    "ARG001", # unused function argument (common in frameworks)
    "ARG002", # unused method argument
]

# Allow autofix for all enabled rules
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
# Tests can use assert, print, etc.
"tests/**/*.py" = ["S101", "T20", "ARG"]
"test_*.py" = ["S101", "T20", "ARG"]
# Scripts may use print
"scripts/**/*.py" = ["T20"]
# Init files
"__init__.py" = ["F401"]  # unused imports OK in __init__

[tool.ruff.lint.isort]
known-first-party = ["src", "backend"]
force-single-line = false
lines-after-imports = 2

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# =============================================================================
# BLACK - Code Formatter (backup/alternative to ruff format)
# =============================================================================
[tool.black]
line-length = 100
target-version = ['py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.git
    | \.venv
    | venv
    | __pycache__
    | \.pytest_cache
    | build
    | dist
    | frontend
    | runs
    | models
    | notebooks
)/
'''

# =============================================================================
# ISORT - Import Sorting
# =============================================================================
[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
known_first_party = ["src", "backend"]
known_third_party = ["fastapi", "pydantic", "uvicorn", "torch", "numpy", "cv2"]
skip = [".venv", "venv", "frontend", "runs", "models", "notebooks"]
skip_glob = ["**/migrations/*"]

# =============================================================================
# MYPY - Static Type Checking
# =============================================================================
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = [
    "venv",
    ".venv",
    "tests",
    "frontend",
    "runs",
    "models",
    "notebooks",
]

# Per-module configuration
[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "cv2.*",
    "ultralytics.*",
    "onnxruntime.*",
    "minio.*",
    "redis.*",
]
ignore_missing_imports = true

# =============================================================================
# PYTEST - Testing Framework
# =============================================================================
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--strict-config",
    "-ra",
    "--tb=short",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "smoke: marks tests as smoke tests for quick validation",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

# =============================================================================
# COVERAGE - Test Coverage
# =============================================================================
[tool.coverage.run]
source = ["src", "backend"]
branch = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/migrations/*",
    "*/.venv/*",
    "*/venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "@abstractmethod",
]
fail_under = 50
show_missing = true
skip_covered = true

[tool.coverage.html]
directory = "htmlcov"

# =============================================================================
# BANDIT - Security Linting
# =============================================================================
[tool.bandit]
exclude_dirs = ["tests", "venv", ".venv", "frontend", "notebooks"]
skips = [
    "B101",  # assert_used (OK in tests, excluded anyway)
    "B104",  # hardcoded_bind_all_interfaces (intentional for containers)
]

[tool.bandit.assert_used]
skips = ["*_test.py", "test_*.py"]

# =============================================================================
# COMMITIZEN - Conventional Commits
# =============================================================================
[tool.commitizen]
name = "cz_conventional_commits"
version = "1.0.0"
tag_format = "v$version"
update_changelog_on_bump = true
changelog_incremental = true
annotated_tag = true

[tool.commitizen.customize]
message_template = "{{change_type}}{% if scope %}({{scope}}){% endif %}: {{message}}"
schema_pattern = "^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\\(\\w+\\))?!?:\\s.+"

# =============================================================================
# PIP-TOOLS - Dependency Management
# =============================================================================
# Use pip-compile to generate locked requirements:
# pip-compile requirements.in -o requirements.txt
# pip-compile requirements-dev.in -o requirements-dev.txt
